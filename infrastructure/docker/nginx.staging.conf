# ==============================================================================
# MindVault Staging Nginx Reverse Proxy Configuration
# Provides single-origin routing for Frontend SPA and Backend API,
# with SSE streaming support and security headers.
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    upstream mindvault_api {
        server api:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend SPA Static Assets
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
                expires 1M;
                access_log off;
                add_header Cache-Control "public";
            }
        }

        # Server-Sent Events (SSE) Streaming Endpoint for RAG Chat
        location ~ ^/api/conversations/[^/]+/messages/stream$ {
            proxy_pass http://mindvault_api;
            proxy_http_version 1.1;

            # Critical SSE configuration: Disable all buffering
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended read timeout for streaming LLM responses
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # General REST API Proxy
        location /api/ {
            proxy_pass http://mindvault_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}

# ==============================================================================
# MindVault — Full Staging Cloud Simulation Topology (Docker Compose)
# Simulates complete cloud deployment on isolated networks with zero prod access.
# ==============================================================================

services:
  # Isolated Staging PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindvault-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindvault_staging_user
      POSTGRES_PASSWORD: staging_secure_db_password_1234567890
      POSTGRES_DB: mindvault_staging
    ports:
      - "5433:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindvault_staging_user -d mindvault_staging"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mindvault-staging-net

  # Isolated Staging Redis
  redis:
    image: redis:7-alpine
    container_name: mindvault-staging-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - staging_redis_data:/data
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - mindvault-staging-net

  # Isolated Staging Object Storage (MinIO S3 / R2 simulation)
  storage:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: mindvault-staging-storage
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: staging_minio_admin
      MINIO_ROOT_PASSWORD: staging_minio_secret_key_1234567890
    command: server /data --console-address ":9001"
    volumes:
      - staging_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - mindvault-staging-net

  # Bucket provisioner for MinIO
  createbuckets:
    image: minio/mc:RELEASE.2024-11-05T11-41-28Z
    container_name: mindvault-staging-createbuckets
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set staging http://storage:9000 staging_minio_admin staging_minio_secret_key_1234567890;
      mc mb staging/mindvault-staging-documents || true;
      exit 0;
      "
    networks:
      - mindvault-staging-net

  # MindVault API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mindvault-staging-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: "http://localhost:8080"
      DATABASE_URL: "postgresql://mindvault_staging_user:staging_secure_db_password_1234567890@postgres:5432/mindvault_staging"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "staging_jwt_access_secret_32_chars_mindvault_secure_xyz"
      COOKIE_SECRET: "staging_cookie_signing_secret_32_chars_mindvault_secure_xyz"
      STORAGE_PROVIDER: "s3"
      STORAGE_ENDPOINT: "http://storage:9000"
      STORAGE_BUCKET: "mindvault-staging-documents"
      STORAGE_REGION: "us-east-1"
      STORAGE_ACCESS_KEY_ID: "staging_minio_admin"
      STORAGE_SECRET_ACCESS_KEY: "staging_minio_secret_key_1234567890"
      STORAGE_FORCE_PATH_STYLE: "true"
      LLM_PROVIDER: "mock"
      EMBEDDING_PROVIDER: "mock"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - mindvault-staging-net

  # MindVault Background Cloud Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mindvault-staging-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_TYPE: cloud
      WORKER_CONCURRENCY: 2
      DATABASE_URL: "postgresql://mindvault_staging_user:staging_secure_db_password_1234567890@postgres:5432/mindvault_staging"
      REDIS_URL: "redis://redis:6379"
      STORAGE_PROVIDER: "s3"
      STORAGE_ENDPOINT: "http://storage:9000"
      STORAGE_BUCKET: "mindvault-staging-documents"
      STORAGE_REGION: "us-east-1"
      STORAGE_ACCESS_KEY_ID: "staging_minio_admin"
      STORAGE_SECRET_ACCESS_KEY: "staging_minio_secret_key_1234567890"
      STORAGE_FORCE_PATH_STYLE: "true"
      LLM_PROVIDER: "mock"
      EMBEDDING_PROVIDER: "mock"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - mindvault-staging-net

  # MindVault Web Frontend with Nginx Gateway
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: mindvault-staging-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mindvault-staging-net

networks:
  mindvault-staging-net:
    driver: bridge

volumes:
  staging_postgres_data:
    name: mindvault_staging_postgres_data
  staging_redis_data:
    name: mindvault_staging_redis_data
  staging_minio_data:
    name: mindvault_staging_minio_data
